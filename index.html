      </a>

      <button class="btn btn-primary sidebar-add" type="button" data-action="capture">

        <p class="nav-label">Workspace</p>

      <div class="sidebar-foot">
        <div class="demo-chip" id="sidebar-demo" hidden>
          <span class="dot"></span> Demo workspace
          <a href="#/settings" aria-label="Demo settings">Manage</a>
        </div>

          <span class="avatar avatar--sm" aria-hidden="true">?</span>
          <span class="profile-mini-text">
            <strong>Your profile</strong>
            <small>Set up your details</small>
          </span>
        </a>
      </div>
    </aside>

    <div class="app-main">
      <header class="mobile-topbar">
        <a class="brand" href="#/today" aria-label="Kazi home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-word">kazi</span>
        </a>
        <div class="mobile-actions">
          <button class="icon-btn" type="button" data-action="search-jump" aria-label="Search jobs">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
          </button>
          <button class="icon-btn icon-btn--accent" type="button" data-action="capture" aria-label="Capture a job">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1">
        <div class="loading-state">
          <span class="spinner" aria-hidden="true"></span>
          <p>Opening your workspace…</p>
        </div>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <a href="#/today" data-nav="today">
          <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>
          <span>Today</span>
        </a>
        <a href="#/jobs" data-nav="jobs">
          <svg class="icon" aria-hidden="true"><use href="#i-briefcase"></use></svg>
          <span>Pipeline</span>
          <span class="nav-count nav-count--mobile" id="nav-pipeline-count-mobile" hidden></span>
        </a>
        <button class="bottom-add" type="button" data-action="capture" aria-label="Capture a job">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
        </button>
        <a href="#/studio" data-nav="studio">
          <svg class="icon" aria-hidden="true"><use href="#i-cv"></use></svg>
          <span>CV</span>
        </a>
        <a href="#/more" data-nav="more">
          <svg class="icon" aria-hidden="true"><use href="#i-more"></use></svg>
          <span>More</span>
        </a>
      </nav>
    </div>
